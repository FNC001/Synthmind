[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthmind"
version = "1.0.0"
description = "Structure-to-precursor and synthesis-condition prediction for inorganic materials."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Honglin" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "tabulate>=0.9",
]

[project.optional-dependencies]
models = [
  "torch>=2.1",
  "lightgbm>=4.0",
  "transformers==4.53.2",
  "sentencepiece==0.2.0",
  "chgnet>=0.3",
  "pymatgen>=2024.0",
  "mp-api>=0.40",
]
test = ["pytest>=8.0"]
figures = [
  "matplotlib>=3.8",
  "SciencePlots>=2.1",
  "ase>=3.22",
]

[project.scripts]
synthmind = "synthmind.cli:main"

[tool.setuptools.packages.find]
include = ["synthmind*", "training*", "pipeline*", "chemistry*"]

[tool.setuptools.package-data]
"synthmind.chemistry" = ["*.yaml"]
